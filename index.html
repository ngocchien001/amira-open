<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIRA OPEN — Giải billiards 9 bi xếp cao</title>
<meta name="description" content="AMIRA Open — giải billiards 9 bi xếp cao, 23h00 ngày 25/9/2026 tại Thái Tuấn Billiards, 39 Lê Văn Lương. Lệ phí 50.000đ, giải nhất 200.000đ kèm cúp. Xem nhánh đấu tứ kết, bán kết, chung kết.">
<meta name="theme-color" content="#fffaf3">

<!-- Ảnh và thông tin khi chia sẻ link (Facebook, Zalo, Messenger, X…).
     ĐỔI tên miền bên dưới cho khớp nơi trang được deploy — các trình quét link
     không chạy JavaScript và không hiểu đường dẫn tương đối, nên bốn thẻ có
     https://… phải là URL tuyệt đối thì ảnh mới hiện. -->
<link rel="canonical" href="https://amira-open.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AMIRA OPEN">
<meta property="og:locale" content="vi_VN">
<meta property="og:url" content="https://amira-open.vercel.app/">
<meta property="og:title" content="AMIRA OPEN — Giải billiards 9 bi xếp cao">
<meta property="og:description" content="23h00 ngày 25/9/2026 tại Thái Tuấn Billiards, 39 Lê Văn Lương. Lệ phí 50.000đ, giải nhất 200.000đ kèm cúp.">
<meta property="og:image" content="https://amira-open.vercel.app/assets/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Hai tay cơ đang vào bi trên bàn billiards tại giải AMIRA Open">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AMIRA OPEN — Giải billiards 9 bi xếp cao">
<meta name="twitter:description" content="23h00 ngày 25/9/2026 tại Thái Tuấn Billiards, 39 Lê Văn Lương. Lệ phí 50.000đ.">
<meta name="twitter:image" content="https://amira-open.vercel.app/assets/og-image.jpg">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="styles.css">
<script>
  /* Chạy trước khi thân trang hiện ra để không bị "nháy" trang chính
     một nhịp rồi mới tới màn giới thiệu. Việc có chạy màn giới thiệu hay không
     do js/data.js quyết định (TOURNAMENT.intro), js/intro.js sẽ gỡ lớp này ngay
     nếu lần này không chạy. */
  (function () {
    try {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    } catch (e) { /* trình duyệt cũ: cứ hiện màn giới thiệu */ }
    document.documentElement.classList.add('intro-pending');
  })();
</script>
</head>
<body>

<!-- Màn giới thiệu, nội dung do js/intro.js dựng -->
<div class="intro" id="intro"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo" id="brandLogo"></span>
    <div class="brand-text">
      <h1 id="tourName">AMIRA OPEN</h1>
      <p id="tourSubtitle">Giải billiards 9 bi · thể thức xếp cao</p>
    </div>
  </div>

  <div class="topbar-actions">
    <span class="sync-chip" id="syncChip" hidden></span>
    <p class="hint">Bấm <b>+ / −</b> để ghi ván · bấm <b>✓</b> để chọn người thắng</p>
    <button type="button" class="btn btn-ghost" id="introReplayBtn">Giới thiệu</button>
    <button type="button" class="btn btn-ghost" id="resetAllBtn">Đặt lại giải</button>
  </div>
</header>

<main>
  <div class="bracket-scroll">
    <div class="bracket" id="bracket">
      <svg class="connectors" id="connectors" aria-hidden="true"></svg>
      <!-- các vòng đấu được render bằng JS -->
    </div>
  </div>
</main>

<!-- Nút lệ phí ở góc màn hình -->
<button type="button" class="fee-fab" id="feeBtn" aria-haspopup="dialog">
  <span class="fee-fab-icon" aria-hidden="true">₫</span>
  <span class="fee-fab-text">Lệ phí <b id="feeFabAmount">50.000đ</b></span>
</button>

<!-- Popup QR đóng lệ phí -->
<div class="modal" id="feeModal" role="dialog" aria-modal="true" aria-labelledby="feeModalTitle" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="document">
    <button type="button" class="modal-close" id="feeCloseBtn" aria-label="Đóng" data-close>✕</button>

    <p class="modal-eyebrow">Quét mã để chuyển tiền đến</p>
    <h2 class="modal-holder" id="feeModalTitle">NGUYEN HOANG ANH</h2>
    <p class="modal-account">
      <span id="feeAccount">9468 2547 0111 23</span>
      <button type="button" class="copy-btn" id="copyAccountBtn" title="Sao chép số tài khoản">Sao chép</button>
    </p>

    <div class="qr-wrap">
      <img id="feeQr" src="assets/qr-techcombank.png" alt="Mã VietQR Techcombank của NGUYEN HOANG ANH" width="294" height="336">
    </div>

    <p class="modal-amount">VND <b id="feeAmount">50.000</b></p>
    <p class="modal-content-line" id="feeContent">AMIRA Open</p>

    <p class="modal-note">
      Lệ phí tham gia <b id="feeNoteAmount">50.000đ</b> / người.
      <span id="feeNote">Người thua trả tiền bàn.</span>
    </p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/logo.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/intro.js"></script>
<script src="js/app.js"></script>
</body>
</html>
