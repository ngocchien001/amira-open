<circle cx="100" cy="100" r="74" fill="#fffaf3"/>
<circle cx="100" cy="100" r="78" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.6"/>
<text class="logo-text">
<textPath href="#aml1-top" startOffset="50%">AMIRA OPEN</textPath>
</text>
<text class="logo-text logo-text-sm">
