<svg width="200" height="200" class="logo logo-full" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AMIRA OPEN — billiards 9 bi">
<style>
    .logo-text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px; font-weight: 800; letter-spacing: 2.6px; fill: #fff; text-anchor: middle; }
    .logo-text-sm { font-size: 12.5px; letter-spacing: 2.1px; fill: #fff5e8; }
    .logo-num { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 27px; font-weight: 800; fill: #2a2118; text-anchor: middle; dominant-baseline: central; }
  </style>
<defs>
<radialGradient id="aml1-ball" cx="36%" cy="30%" r="74%">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="58%" stop-color="#f7f0e5"/>
<stop offset="100%" stop-color="#cbbca9"/>
</radialGradient>
<linearGradient id="aml1-stripe" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#ffd84d"/>
<stop offset="55%" stop-color="#f9b118"/>
<stop offset="100%" stop-color="#e88c00"/>
</linearGradient>
<linearGradient id="aml1-ring" x1="6%" y1="0%" x2="94%" y2="100%">
<stop offset="0%" stop-color="#fdb259"/>
<stop offset="50%" stop-color="#ef6c1a"/>
<stop offset="100%" stop-color="#c34706"/>
</linearGradient>
<radialGradient id="aml1-gloss" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
<stop offset="60%" stop-color="#ffffff" stop-opacity=".35"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<clipPath id="aml1-clip">
