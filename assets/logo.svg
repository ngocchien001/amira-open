<ellipse cx="79" cy="74" rx="19" ry="12" fill="url(#aml1-gloss)" transform="rotate(-26 79 74)"/>
<circle cx="100" cy="100" r="50" fill="none" stroke="#bda992" stroke-opacity=".45" stroke-width="1.6"/>
