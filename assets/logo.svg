<path id="aml1-top" d="M 19 100 A 81 81 0 0 1 181 100" fill="none"/>
<path id="aml1-bot" d="M 11 100 A 89 89 0 0 0 189 100" fill="none"/>
</defs>
<g class="logo-ring">
