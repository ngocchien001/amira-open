<svg width="200" height="252" class="logo logo-full" viewBox="0 0 200 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AMIRA OPEN — billiards 9 bi">
<style>
    .logo-num { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 17px; font-weight: 800; fill: #c2450a; text-anchor: middle; dominant-baseline: central; }
    .logo-word { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 34px; font-weight: 800; letter-spacing: 2.5px; text-anchor: middle; }
    .logo-sub { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 9px; fill: #c9a05c; text-anchor: middle; }
  </style>
<defs>
<linearGradient id="aml1-shield" x1="18%" y1="0%" x2="82%" y2="100%">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="62%" stop-color="#fffaf2"/>
<stop offset="100%" stop-color="#f6e8d6"/>
</linearGradient>
<linearGradient id="aml1-gold" x1="10%" y1="0%" x2="90%" y2="100%">
<stop offset="0%" stop-color="#f3daa6"/>
<stop offset="38%" stop-color="#dcae55"/>
<stop offset="100%" stop-color="#b8832f"/>
</linearGradient>
<radialGradient id="aml1-ball" cx="34%" cy="28%" r="78%">
<stop offset="0%" stop-color="#ffc178"/>
<stop offset="42%" stop-color="#f4881f"/>
<stop offset="100%" stop-color="#c2450a"/>
</radialGradient>
<radialGradient id="aml1-gloss" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="aml1-cue" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#b0672c"/>
<stop offset="34%" stop-color="#dcab68"/>
<stop offset="100%" stop-color="#f0d7ac"/>
</linearGradient>
<linearGradient id="aml1-word" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#f08a2c"/>
<stop offset="100%" stop-color="#d4530a"/>
</linearGradient>
</defs>
<g class="logo-emblem">
<circle cx="100" cy="99" r="77" fill="none" stroke="url(#aml1-gold)" stroke-opacity=".38" stroke-width="1.3"/>
<g class="logo-cue">
<path d="M 31.4 171.4 L 172.5 28.5 L 171.5 27.5 L 28.6 168.6 Z" fill="url(#aml1-cue)"/>
<circle cx="30" cy="170" r="2.2" fill="#b0672c"/>
</g>
<g class="logo-shield">
<path d="M 56 34 H 144 Q 150 34 150 40 V 92 Q 150 132 100 170 Q 50 132 50 92 V 40 Q 50 34 56 34 Z" fill="url(#aml1-shield)" stroke="url(#aml1-gold)" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M 61 40 H 139 Q 144 40 144 45.5 V 91 Q 144 126 100 160 Q 56 126 56 91 V 45.5 Q 56 40 61 40 Z" fill="none" stroke="url(#aml1-gold)" stroke-opacity=".5" stroke-width="1" stroke-linejoin="round"/>
</g>
<g class="logo-ball">
<ellipse cx="100" cy="128" rx="27" ry="5" fill="#c9701f" opacity=".16"/>
<circle cx="100" cy="90" r="31" fill="url(#aml1-ball)"/>
<circle cx="100" cy="90" r="14" fill="#fffdf9"/>
<text class="logo-num" x="100" y="90">9</text>
<ellipse cx="87" cy="76" rx="11.5" ry="7" fill="url(#aml1-gloss)" transform="rotate(-28 87 76)"/>
<circle cx="100" cy="90" r="31" fill="none" stroke="#a83c06" stroke-opacity=".28" stroke-width="1.1"/>
</g>
</g>
<g class="logo-wordmark">
<text class="logo-word" x="101.3" y="216" fill="url(#aml1-word)">AMIRA</text>
<text class="logo-sub" x="104.5" y="238">OPEN</text>
<path d="M 38 234 H 56 M 144 234 H 162" stroke="#cfa863" stroke-opacity=".9" stroke-width="1.4" stroke-linecap="round"/>
</g>
</svg>
