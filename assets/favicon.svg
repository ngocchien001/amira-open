      font-size: 17px; font-weight: 800; fill: #c2450a; text-anchor: middle; dominant-baseline: central; }
    .logo-word { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 34px; font-weight: 800; letter-spacing: 2.5px; text-anchor: middle; }
    .logo-sub { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 9px; fill: #c9a05c; text-anchor: middle; }
  </style>
<defs>
<linearGradient id="aml3-shield" x1="18%" y1="0%" x2="82%" y2="100%">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="62%" stop-color="#fffaf2"/>
<stop offset="100%" stop-color="#f6e8d6"/>
</linearGradient>
<linearGradient id="aml3-gold" x1="10%" y1="0%" x2="90%" y2="100%">
<stop offset="0%" stop-color="#f3daa6"/>
<stop offset="38%" stop-color="#dcae55"/>
<stop offset="100%" stop-color="#b8832f"/>
</linearGradient>
